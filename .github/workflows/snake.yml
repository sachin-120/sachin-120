name: Generate Contribution Snake

on:
  # Daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Also run when this repo's main branch is updated
  push:
    branches:
      - main

# Required so the workflow can push to the "output" branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=bb9af7&color_dots=#161b22,#1f3b5c,#2a6f97,#7dcfff,#bb9af7

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.3.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
